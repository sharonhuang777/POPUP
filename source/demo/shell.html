<meta charset="utf-8">
<title>Popup Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#EEE9F3;--ink:#3A3150;--muted:#7C7392;--frame:#1B1722}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17141D;--ink:#ECE6F5;--muted:#A49BB6;--frame:#000}}
:root[data-theme="dark"]{--bg:#17141D;--ink:#ECE6F5;--muted:#A49BB6;--frame:#000}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:402px;height:874px;flex:none;transform-origin:center center}
.phone{position:absolute;inset:0;border-radius:54px;overflow:hidden;background:#FBF3EE;box-shadow:0 0 0 10px var(--frame),0 30px 80px rgba(40,20,70,.35)}
iframe{position:absolute;inset:0;width:402px;height:874px;border:0;display:block;opacity:0;visibility:hidden;z-index:0;transition:opacity .18s ease,visibility 0s linear .18s}
iframe.on{opacity:1;visibility:visible;z-index:1;transition:opacity .18s ease,visibility 0s}
.status{position:absolute;left:0;top:0;width:402px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;pointer-events:none;font:600 16px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:#1B1722;z-index:2}
.status svg{display:block}
.phone.dark .status{color:#fff}.phone.dark .home-ind{background:#fff;opacity:.7}.phone.dark{background:#1F1540}
.island{position:absolute;left:50%;top:11px;width:122px;height:34px;margin-left:-61px;border-radius:20px;background:#000;z-index:3;pointer-events:none}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1B1722;opacity:.85;z-index:2;pointer-events:none}
.side{position:absolute;left:100%;top:50%;margin-left:44px;width:220px;transform:translateY(-50%)}
.side h1{margin:0;font-size:22px;font-weight:700}
.side p{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--muted)}
.side button{margin-top:16px;height:36px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:transparent;color:var(--ink);font:500 14px 'Outfit',sans-serif;cursor:pointer}
@media (max-width:900px){.side{display:none}}
@media (max-width:440px){.phone{border-radius:0;box-shadow:none}}
body.m{background:#FCF1E8;display:block;overflow:hidden}
body.m .phone{border-radius:0;box-shadow:none;background:transparent}
body.m .island,body.m .status,body.m .home-ind,body.m .side{display:none}

.tabbar{position:absolute;left:16px;bottom:34px;width:370px;height:58px;box-sizing:border-box;padding:6px;border-radius:29px;z-index:2;overflow:hidden;
 background:linear-gradient(180deg,rgba(247,246,250,0.88) 0%,rgba(236,234,241,0.84) 100%);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
 box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.95),inset 0 2px 3px rgba(255,255,255,0.9),inset 0 -2px 6px rgba(90,80,120,0.06),0 14px 32px rgba(40,30,70,0.13),0 2px 6px rgba(40,30,70,0.06);
 display:grid;grid-template-columns:1fr 1fr 1fr;align-items:stretch;transition:opacity .18s ease,transform .18s ease}
.tabbar.hide{opacity:0;transform:translateY(12px);pointer-events:none}
.tabbar .pill{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/3);border-radius:23px;background:#fff;box-shadow:0 2px 8px rgba(40,30,70,0.08),0 0 0 .5px rgba(40,30,70,0.04);transition:transform .55s cubic-bezier(.34,1.3,.64,1)}
.tabbar button{position:relative;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#2B2533;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar button .a{display:none}.tabbar button.on{color:#1C1726}.tabbar button.on .a{display:block}.tabbar button.on .i{display:none}
.tabbar .orb{width:40px;height:40px;border-radius:50%;background:#EEE8F8 center/112% no-repeat;box-shadow:0 3px 10px rgba(143,114,242,0.3)}
@keyframes tabPop{0%{transform:scale(1)}35%{transform:scale(.8)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
.tabbar .pop{animation:tabPop .5s cubic-bezier(.34,1.56,.64,1)}
.fab{position:absolute;right:18px;bottom:124px;width:56px;height:56px;border-radius:50%;z-index:2;padding:0;border:0;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent;
 background:#FFFFFF;box-shadow:0 6px 24px rgba(0,0,0,0.10),0 1px 4px rgba(0,0,0,0.06),0 0 0 .5px rgba(0,0,0,0.04);
 display:flex;align-items:center;justify-content:center;transition:opacity .2s ease,transform .25s cubic-bezier(.34,1.4,.64,1)}
.fab.hide{opacity:0;transform:scale(.6);pointer-events:none}
.fab svg{display:block}
.toast{position:absolute;left:36px;right:36px;top:420px;z-index:5;padding:13px 18px;border-radius:16px;background:rgba(24,18,38,0.9);border:1px solid rgba(255,255,255,0.14);box-shadow:0 14px 34px rgba(20,10,50,0.30);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:500 14px/1.4 'Outfit',sans-serif;text-align:center;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:opacity .22s ease,transform .3s cubic-bezier(.34,1.4,.64,1)}
.toast.on{opacity:1;transform:none}
.fab:active{transform:scale(.9)}
</style>
<div class="stage" id="stage">
  <div class="phone">
    <nav class="tabbar hide" id="tabbar" aria-label="Tab bar">
      <span class="pill" id="pill"></span>
      <button type="button" data-tab="plaza" aria-label="Plaza"><span class="ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg><svg class="a" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.6" fill="currentColor"/><path d="M15.9 8.1l-2.3 5.5-5.5 2.3 2.3-5.5z" fill="#FFFFFF"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></span></button>
      <button type="button" data-tab="home" aria-label="Home · Popup"><span class="ic orb" style="background-image:url(/*ORB*/)"></span></button>
      <button type="button" data-tab="messages" aria-label="Messages"><span class="ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4c-4.7 0-8.5 3.2-8.5 7.2 0 2.2 1.2 4.2 3 5.5l-.6 2.8 3.2-1.5c.9.3 1.9.4 2.9.4 4.7 0 8.5-3.2 8.5-7.2S16.7 4 12 4z"/></svg><svg class="a" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4c-4.7 0-8.5 3.2-8.5 7.2 0 2.2 1.2 4.2 3 5.5l-.6 2.8 3.2-1.5c.9.3 1.9.4 2.9.4 4.7 0 8.5-3.2 8.5-7.2S16.7 4 12 4z"/></svg></span></button>
    </nav>
    <button type="button" class="fab hide" id="fab" aria-label="Create a post"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#101010" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M10 1.4v17.2M1.4 10h17.2"/></svg></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="island" aria-hidden="true"></div>
    <div class="status" aria-hidden="true">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 8 1C5.4 1 3 2 1.2 3.8l1.1 1.1A8 8 0 0 1 8 2.6zm0 3.2c1.3 0 2.5.5 3.4 1.4l1.1-1.1A6.4 6.4 0 0 0 8 4.2c-1.8 0-3.4.7-4.5 1.9l1.1 1.1c.9-.9 2.1-1.4 3.4-1.4zM8 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" fill="currentColor"/></svg>
        <svg width="27" height="12" viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="8" rx="2" fill="currentColor"/><path d="M25 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <div class="home-ind" aria-hidden="true"></div>
  </div>
  <div class="side">
    <h1>Popup 交互 Demo</h1>
    <p>从首页点「Talk with Popup」进入每日对话，答完 3 题后可选择匹配或稍后；点「Text Match」或「Voice Match」直接进入匹配流程。</p>
    <p>语音匹配走 Standard：先进思考页 → 排队 → 轮到你 → Regular line 第一次匹配失败 → Standard match 再试一次（思考后直接接通）；挂断后是通话结束页，可以打星。免费次数用完后，点 Standard 会提示去 Priority。Priority 直接匹配。</p>
    <button type="button" id="restart">回到首页</button>
  </div>
</div>
<script>
var SCREENS = /*SCREENS*/{};
var phoneEl = document.querySelector('.phone');
var frames = {};          // name -> iframe (kept alive for tab screens)
var NOCACHE = { matched: 1, pmatched: 1, std: 1, pri: 1, text: 1, call: 1, queue: 1, turn: 1, fail: 1, ended: 1 };
var DARK = { call: 1, ended: 1 };   // animation pages replay each visit
var TABS = { plaza: 0, home: 1, messages: 2 };
var current = null, stack = [];
// Voice match: standard attempts left today (launch shows 2 of 3). The first standard search thinks, then queues;
// after the queue the regular line fails once, and the retry connects without queueing.
var LEFT = 2, FAILED = 0, QUEUED = 0, SHOWS_LEFT = { voice: 1, fail: 1, ended: 1 };
var toastEl = null, toastT = 0;
function toast(msg) {
  toastEl = toastEl || document.getElementById('toast');
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
}
function route(name) {
  if (name === 'stdx') {
    if (LEFT <= 0) { toast('No free matches left today. Go Priority to keep matching.'); return null; }
    LEFT--;
    if (frames[current] && SHOWS_LEFT[current]) frames[current].contentWindow.postMessage({ left: LEFT }, '*');
    return 'std';
  }
  if (name === 'call' && current === 'std' && !QUEUED) { QUEUED = 1; return 'queue'; }
  // every connect shows a match-success beat first: priority paths (boosted thinking, Skip the line, Priority on your turn) get the halo one
  if (name === 'call' && current !== 'matched' && current !== 'pmatched') return (current === 'pri' || current === 'queue' || current === 'turn') ? 'pmatched' : 'matched';
  if (name === 'regular') { if (!FAILED) { FAILED = 1; return 'fail'; } return 'matched'; }
  return name;
}
function makeFrame(name) {
  var f = document.createElement('iframe');
  f.title = 'Popup app screen'; f.setAttribute('data-name', name);
  f.srcdoc = SCREENS[name];
  phoneEl.insertBefore(f, phoneEl.firstChild);
  f._ready = new Promise(function (res) { f.addEventListener('load', res, { once: true }); setTimeout(res, 2500); });
  return f;
}
var FRESH = { chat: 1, profile: 1, other: 1 };   // restart when entered forward, keep when returning via Back
function frameFor(name, push) {
  if (NOCACHE[name] || (FRESH[name] && push !== false)) { if (frames[name]) frames[name].remove(); frames[name] = makeFrame(name); }
  else if (!frames[name]) frames[name] = makeFrame(name);
  return frames[name];
}
function show(name, push, from) {
  if (!SCREENS[name]) return;
  if (TABS[name] != null) stack = [name];
  else if (push !== false) stack.push(name);
  var f = frameFor(name, push), prev = current && frames[current];
  f._ready.then(function () {
    if (SHOWS_LEFT[name]) f.contentWindow.postMessage({ left: LEFT }, '*');
    f.classList.add('on');
    if (prev && prev !== f) prev.classList.remove('on');
  });
  current = name;
  phoneEl.classList.toggle('dark', !!DARK[name]);
  setTab(name);
}
var tabbar = document.getElementById('tabbar'), pill = document.getElementById('pill');
var tabBtns = Array.prototype.slice.call(tabbar.querySelectorAll('button'));
function setTab(name) {
  var i = TABS[name];
  document.getElementById('fab').classList.toggle('hide', name !== 'plaza');
  if (i == null) { tabbar.classList.add('hide'); return; }
  tabbar.classList.remove('hide');
  pill.style.transform = 'translateX(' + (i * 100) + '%)';
  tabBtns.forEach(function (b, k) { b.classList.toggle('on', k === i); });
}
tabBtns.forEach(function (b) {
  b.addEventListener('click', function () {
    var name = b.getAttribute('data-tab');
    var ic = b.querySelector('.ic'); ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop');
    if (name !== current) show(name);
  });
});
function preload() { ['plaza', 'messages'].forEach(function (n) { if (!frames[n]) frames[n] = makeFrame(n); }); }
window.addEventListener('message', function (e) {
  if (!current || !frames[current] || e.source !== frames[current].contentWindow || !e.data) return;
  if (e.data.go) { var to = route(e.data.go); if (to) show(to, true, e.data.from); }
  else if (e.data.back) { if (stack.length > 1) { stack.pop(); show(stack[stack.length - 1], false); } }
});
document.getElementById('restart').addEventListener('click', function () { LEFT = 2; FAILED = 0; QUEUED = 0; show('home'); });
function isPhone() {
  var q = location.search;
  if (/[?&]frame=1/.test(q)) return false;
  if (/[?&]mobile=1/.test(q)) return true;
  var w = Math.min(screen.width, window.innerWidth);
  return w <= 500 || (matchMedia('(pointer: coarse)').matches && w <= 820);
}
function fit() {
  var st = document.getElementById('stage');
  var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (isPhone()) {
    // The real status bar replaces the design's top 48px, so crop it and fill the rest.
    var T = 48, s0 = Math.min(vw / 402, vh / (874 - T));
    document.body.classList.add('m');
    st.style.position = 'absolute';
    st.style.transformOrigin = '0 0';
    st.style.left = ((vw - 402 * s0) / 2) + 'px';
    st.style.top = (-T * s0) + 'px';
    st.style.transform = 'scale(' + s0 + ')';
    return;
  }
  document.body.classList.remove('m');
  st.style.position = st.style.left = st.style.top = st.style.transformOrigin = '';
  var wide = vw > 900;
  var w = wide ? 402 + 44 + 220 + 40 : 402 + 24;
  var s = Math.min(1, (vh - 40) / 874, (vw - 16) / w);
  if (vw <= 440) s = Math.min(vw / 402, vh / 874);
  st.style.transform = 'scale(' + s + ')' + (wide ? ' translateX(-133px)' : '');
}
window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
fit();
show('home');
frames.home._ready.then(function () { setTimeout(preload, 600); });
</script>
