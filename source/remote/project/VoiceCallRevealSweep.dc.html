<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice call · Reveal sweep</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* Reveal button sweep: a soft diagonal light band crosses the button (0.9s), then rests; one cycle every 2.6s.
   Band: 70px wide, skewed -20deg, white 0 → 55% → 0, screen blend. A faint outer glow breathes on the same beat. */
@keyframes rvSweep{0%{transform:translateX(-120px) skewX(-20deg)}35%,100%{transform:translateX(440px) skewX(-20deg)}}
@keyframes rvGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 0 0 0 rgba(170,130,255,0)}30%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 0 22px 3px rgba(190,150,255,0.42)}}
.rv-band{animation:rvSweep 2.6s cubic-bezier(.45,.05,.35,1) infinite}
.rv-glow{animation:rvGlow 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.rv-band,.rv-glow{animation:none}.rv-band{opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: #1F1540 url(./img/call-revealed.jpg) 0 0 / 402px 874px no-repeat">
  <!-- Reveal button rebuilt over the design export (same fills as Figma "Button · Reveal to keep talking");
       the design's static white sheen (2nd fill, 70%) becomes the moving band. -->
  <button class="rv-glow" style="position: absolute; left: 16px; top: 694px; width: 370px; height: 54px; box-sizing: border-box; border-radius: 18px; border: 1px solid rgba(255,255,255,0.3); overflow: hidden; padding: 0; cursor: pointer; background: linear-gradient(120deg, #B394FA 0%, #8B62F0 50%, #B46DE0 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif">
    <span class="rv-band" aria-hidden="true" style="position: absolute; left: 0; top: -12px; width: 64px; height: 78px; opacity: 0.7; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #FFFFFF 50%, rgba(255,255,255,0) 100%); pointer-events: none"></span>
    <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 100%; color: #FFFFFF; font-size: 16px; font-weight: 700; letter-spacing: -0.2px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      Reveal to keep talking
    </span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
