<style>
body{margin:0}
@keyframes drift{0%,100%{transform:translate(-1%,-.5%)}50%{transform:translate(1%,.6%)}}
@keyframes qLane{from{transform:translateX(0)}to{transform:translateX(-26px)}}
@keyframes qFront{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qGate{0%,100%{box-shadow:0 0 0 0 rgba(242,84,91,0.35),0 8px 18px rgba(240,100,80,0.28)}50%{box-shadow:0 0 0 8px rgba(242,84,91,0),0 8px 18px rgba(240,100,80,0.28)}}
@keyframes qSpin{to{transform:rotate(360deg)}}
.ambient{animation:drift 28s ease-in-out infinite}
.q-lane{animation:qLane 1.6s cubic-bezier(.5,0,.3,1) infinite}
.q-front{animation:qFront 1.6s cubic-bezier(.5,0,.3,1) infinite}
.q-gate{animation:qGate 1.6s ease-out infinite}
.q-glint{transform-origin:110px 110px;animation:qSpin 6s linear infinite}
.q-arc{transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){.ambient,.q-lane,.q-front,.q-gate,.q-glint{animation:none}}
</style>
</helmet>

    <div style="position: absolute; right: 0; top: 6px; width: 56px; display: flex; flex-direction: column; align-items: center">
      <div style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 50%; padding: 2.5px; background: linear-gradient(150deg, #FFA45C 0%, #F2545B 45%, #8F6FF0 100%); box-shadow: 0 0 0 4px rgba(255,255,255,0.8), 0 10px 22px rgba(140,90,190,0.25)">
