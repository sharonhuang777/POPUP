<style>
body{margin:0}
@keyframes drift{0%,100%{transform:translate(-1%,-.5%)}50%{transform:translate(1%,.6%)}}
@keyframes qRipple{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.3);opacity:0}}
@keyframes qSheen{0%{left:-60px}60%,100%{left:calc(100% + 20px)}}
@keyframes qLive{0%,100%{box-shadow:0 0 0 0 rgba(60,203,127,.45)}50%{box-shadow:0 0 0 5px rgba(60,203,127,0)}}
.ambient{animation:drift 28s ease-in-out infinite}
.q-fill{transition:width .7s cubic-bezier(.2,.7,.2,1)}
.q-you{transition:left .7s cubic-bezier(.2,.7,.2,1)}
.q-ring{animation:qRipple 2.1s cubic-bezier(.2,.6,.3,1) infinite}
.q-ring.r2{animation-delay:.7s}
.q-ring.r3{animation-delay:1.4s}
.q-sheen{animation:qSheen 1.8s ease-in-out infinite}
.q-live{animation:qLive 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ambient,.q-ring,.q-sheen,.q-live{animation:none}.q-ring{opacity:0}.q-fill,.q-you{transition:none}}
</style>
